# Shared defaults for every single-source and dual-source setting.
# Override only source_cities and target_city to change the transfer setting.
source_cities: [bj, cd]
target_city: xa

stage1:
  seed: 42
  role_count: 8
  role_dim: 96                 # POI hidden representation dimension d
  hidden_dim: 96               # MLP hidden width
  embedding_dim: 96            # 48 local + 24 role + 24 interaction
  temperature: 0.06
  direction_scale: 0.75
  grammar_attention_temperature: 1.0
  mobility_prior_scale: 0.5
  dropout: 0.2
  poi_warmup_epochs: 12
  grammar_epochs: 24
  joint_epochs: 36
  poi_learning_rate: 0.0005
  grammar_learning_rate: 0.003
  joint_learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 2.0
  log_every: 25
  w_poi_hidden: 0.5
  w_poi: 0.2
  w_dynamic: 0.2
  w_grammar: 1.0
  w_residual: 0.5
  w_directional_anchor: 0.2
  w_balance: 0.05
  w_sharpness: 0.05
  w_variance: 0.1
  w_covariance: 0.001
  city_delta_rank: 1
  city_delta_scale: 0.15
  city_delta_penalty: 0.2
  city_center_penalty: 0.5

stage2:
  # Architecture and role anchors are inherited from the Stage-I checkpoint.
  seed: 42
  epochs: 300
  learning_rate: 0.00085
  min_learning_rate: 0.00013
  weight_decay: 0.0001
  grad_clip: 2.0
  log_every: 25
  mode: full
  output_variant: local_role   # One 72-dimensional embedding for all tasks
  selection_metric: validation_loss
  validation_fraction: 0.2
  dropout: 0.2
  direction_scale: 0.75
  grammar_attention_temperature: 1.0
  mobility_prior_scale: 0.5
  w_role: 1.0
  w_dynamic: 0.5
  w_confidence: 0.05
  w_context: 1.0
  w_grammar_embedding: 0.5
  w_embedding: 0.1
  w_poi: 0.2
  w_sharpness: 0.03
  w_balance: 0.03
  w_variance: 0.1
  w_covariance: 0.001
